<html>
<head>
    <title>ANIMACION 3 CSS</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        /* 1. Cambio del color de fondo al RGB solicitado */
        body {
            background-color: rgb(123, 47, 47);
            color: white;
        }

        /* 2. Centrado horizontal del título */
        h1 {
            text-align: center;
            margin: 20px 0;
        }

        /* 3. Contenedor intacto (400x200, borde y overflow) */
        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background-color: white; /* Para que resalte el cuadrito negro */
        }

        .cuadrito{
            width: 100px;
            height: 100px;
            background-color: black;
            position: absolute;
            top: 0;
            left: 150px;
            animation: cuadrito 3s infinite linear;
        }

        @keyframes cuadrito{
            from{
                top: 0;
            }
            to{
                top: 100px;
            }
        }

        /* Estilo para el enlace volver */
        a {
            display: block;
            text-align: center;
            color: white;
            margin-top: 10px;
            text-decoration: none;
        }
    </style>
</head>    
<body>
    <h1>ANIMACIÓN DE MEGAMAN X</h1>
    <div class="contenedor">
        <div class ="cuadrito"></div>
    </div>
    <br>
    <a href="index.html">Volver</a>
</body>
</html>
